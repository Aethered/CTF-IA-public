services:

  # --------------------------------------------------
  # Service LLM partage (llama.cpp)
  # --------------------------------------------------
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ctf-llm
    command:
      - "-m"
      - "/models/${MODEL_FILE:-qwen2.5-3b-instruct-q4_k_m.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "2048"
      - "--threads"
      - "${LLM_THREADS:-4}"
    volumes:
      - ./models:/models:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  # --------------------------------------------------
  # Challenges IA (avec LLM)
  # --------------------------------------------------
  challenge_01:
    image: ghcr.io/aethered/ctf-ia/challenge_01:latest
    container_name: ctf-ch-01
    ports:
      - "8000:8000"
    environment:
      LLM_URL: "http://llm:8080/v1/chat/completions"
    depends_on:
      - llm

  challenge_02:
